<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>涂盛皓</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 40px auto; padding: 0 16px; background: #050508; color: #e2e8f0; }
    h1 { font-weight: 300; letter-spacing: 0.08em; position: relative; }
    h1::before, h1::after { content: attr(data-text); position: absolute; left: 0; top: 0; width: 100%; }
    h1::before { color: #00f0ff; animation: glitch 3s infinite steps(1); clip-path: inset(20% 0 40% 0); transform: translate(-2px, 0); opacity: 0; }
    h1::after { color: #ff003c; animation: glitch 3s infinite steps(1) reverse; clip-path: inset(60% 0 10% 0); transform: translate(2px, 0); opacity: 0; }
    @keyframes glitch { 0%, 92% { opacity: 0; } 93%, 96% { opacity: 0.8; } 97%, 100% { opacity: 0; } }
    p { color: #94a3b8; }
    .tag { color: #fcee0a; letter-spacing: 0.3em; font-size: 12px; }
    #scene { height: 560px; overflow: hidden; clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px)); }
    #scene canvas { display: block; }
    .scanlines { position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px); }
  </style>
</head>
<body>
  <div class="scanlines"></div>
  <h1 data-text="涂盛皓">涂盛皓</h1>
  <p>香港科技大学（广州）大一学生，机器人 / AI 方向。</p>
  <p class="tag">/// NIGHT CITY</p>
  <div id="scene"></div>
  <p>拖动旋转，滚轮缩放。</p>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const container = document.getElementById('scene');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050508);
    scene.fog = new THREE.Fog(0x050508, 9, 20);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(2.8, 1.9, 3.6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    container.appendChild(renderer.domElement);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.5;

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.enablePan = false;
    controls.minDistance = 2.5;
    controls.maxDistance = 10;
    controls.target.set(0, 0.9, 0);
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.6;

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(container.clientWidth, container.clientHeight), 0.35, 0.4, 0.8);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    scene.add(new THREE.HemisphereLight(0xffffff, 0x1a1a2e, 0.6));
    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(4, 6, 3);
    sun.castShadow = true;
    scene.add(sun);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(2.2, 48),
      new THREE.MeshStandardMaterial({ color: 0x0a0a12 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const ring = new THREE.Mesh(
      new THREE.RingGeometry(2.2, 2.32, 64),
      new THREE.MeshBasicMaterial({ color: 0xfcee0a, side: THREE.DoubleSide })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.01;
    scene.add(ring);

    const grid = new THREE.GridHelper(12, 24, 0x00f0ff, 0x1a2f4a);
    grid.material.transparent = true;
    grid.material.opacity = 0.3;
    grid.position.y = -0.01;
    scene.add(grid);

    const loader = new GLTFLoader();
    const mixers = [];
    let flamingo;
    function loadModel(url, scale, pos, animName, onLoad) {
      loader.load(url, (gltf) => {
        const m = gltf.scene;
        m.scale.setScalar(scale);
        m.position.set(pos[0], pos[1], pos[2]);
        m.traverse((o) => { if (o.isMesh) o.castShadow = true; });
        scene.add(m);
        const mixer = new THREE.AnimationMixer(m);
        const clip = gltf.animations.find((a) => a.name === animName);
        if (clip) mixer.clipAction(clip).play();
        mixers.push(mixer);
        if (onLoad) onLoad(m);
      });
    }
    loadModel('models/RobotExpressive.glb', 0.55, [-0.9, 0, 0], 'Idle');
    loadModel('models/Xbot.glb', 1.2, [0.9, 0, 0], 'idle');
    loadModel('models/Flamingo.glb', 0.025, [0, 3, 0], 'flamingo_flyA_', (m) => { flamingo = m; });

    const buildingMat = new THREE.MeshStandardMaterial({ color: 0x0b0b14, roughness: 0.9 });
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * Math.PI * 2 + Math.random() * 0.3;
      const r = 6.5 + Math.random() * 2.5;
      const w = 0.9 + Math.random() * 0.9;
      const h = 1.5 + Math.random() * 3.5;
      const d = 0.9 + Math.random() * 0.9;
      const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), buildingMat);
      b.position.set(Math.cos(a) * r, h / 2, Math.sin(a) * r);
      scene.add(b);
      const dir = new THREE.Vector3(Math.cos(a), 0, Math.sin(a));
      const nWin = 1 + Math.floor(Math.random() * 3);
      for (let j = 0; j < nWin; j++) {
        const win = new THREE.Mesh(
          new THREE.PlaneGeometry(0.12, 0.18),
          new THREE.MeshBasicMaterial({ color: Math.random() < 0.5 ? 0xfcee0a : 0x00f0ff })
        );
        win.position.copy(b.position).addScaledVector(dir, -(d / 2 + 0.01));
        win.position.y = 0.5 + Math.random() * (h - 0.8);
        win.lookAt(0, win.position.y, 0);
        scene.add(win);
      }
    }

    const dustCount = 150;
    const dustGeo = new THREE.BufferGeometry();
    const pos = new Float32Array(dustCount * 3);
    const col = new Float32Array(dustCount * 3);
    const palette = [new THREE.Color(0x00f0ff), new THREE.Color(0xff003c), new THREE.Color(0xfcee0a)];
    for (let i = 0; i < dustCount; i++) {
      pos[i * 3] = (Math.random() - 0.5) * 10;
      pos[i * 3 + 1] = Math.random() * 4;
      pos[i * 3 + 2] = (Math.random() - 0.5) * 10;
      const c = palette[Math.floor(Math.random() * 3)];
      col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
    }
    dustGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    dustGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ size: 0.04, vertexColors: true, transparent: true, opacity: 0.7, depthWrite: false }));
    scene.add(dust);

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
      composer.setSize(container.clientWidth, container.clientHeight);
    });

    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = clock.getDelta();
      const t = clock.elapsedTime;
      mixers.forEach((m) => m.update(dt));
      if (flamingo) {
        const a = t * 0.25;
        flamingo.position.set(Math.cos(a) * 3.2, 3.0 + Math.sin(t * 0.8) * 0.3, Math.sin(a) * 3.2);
        flamingo.rotation.y = -a;
      }
      dust.rotation.y += 0.0004;
      controls.update();
      composer.render();
    });
  </script>
</body>
</html>
