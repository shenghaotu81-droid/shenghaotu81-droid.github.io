name: Build and publish gallery
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/build_content.py
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site/models
          cp index.html credits.html _site/
          cp -r content styles scripts _site/
          cp -r models/nature models/exhibits _site/models/
          if [ -f CNAME ]; then cp CNAME _site/; fi
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
